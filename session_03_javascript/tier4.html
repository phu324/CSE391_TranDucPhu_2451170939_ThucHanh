    console.log(thongBao);

        soNgauNhien.filter(
            so => so > 10
        );

    console.log(soLon);

        },
        {
            id: 2,

        {
            id: 3,

    // ==================================================

    console.log("===== BÀI 4.4 =====");

    let mayTinh = {

        giaTri: 0,

        cong(so) {
            this.giaTri += so;
